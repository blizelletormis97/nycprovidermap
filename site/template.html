<!-- Generated by src/lib/build-site.ts from the cached provider data. Edit site/template.html, not the output. -->

<style>
@font-face { font-family: "Nunito"; font-style: normal; font-weight: 200 1000; font-display: swap; src: url("__FONT_NUNITO__") format("woff2"); }
@font-face { font-family: "Fredoka"; font-style: normal; font-weight: 600; font-display: swap; src: url("__FONT_FREDOKA__") format("woff2"); }

/* Layout: one-screen tool. A pastel "ribbon" header, a soft filter rail on the left, the map on the right
   (map on top, filters below on phones). Each service family has its own pastel so it reads at a glance. */
:root {
  --bg: #fdf8ff;
  --panel: #ffffff;
  --ink: #2b2550;
  --muted: #6c6590;
  --line: #ece6f7;
  --accent: #7b61ff;
  --accent-ink: #ffffff;
  --focus: #b8a8ff;

  /* pastels: fills for chips, groups and cards */
  --peach: #ffe1cf;
  --pink: #ffd9ec;
  --lilac: #e8e0ff;
  --sky: #d3f0ff;
  --mint: #ccf5e3;
  --lemon: #fff3c4;

  /* bright pastels: map markers and source dots */
  --src-article16: #ff8b74;
  --src-opwdd: #a68bff;
  --src-medicaid: #3fc1e9;
  --src-homecare: #4fcf8e;
  --src-registered: #f27fbb;
  --src-aba: #f5b83d;
  --src-cdpap: #2fbfae;

  --shadow: 0 6px 20px rgb(123 97 255 / 0.12);
  --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17142b; --panel: #211c3a; --ink: #f4f0ff; --muted: #b6aed9; --line: #342d58;
    --accent: #a993ff; --accent-ink: #17142b; --focus: #7b61ff;
    --peach: #4c3233; --pink: #4b2c46; --lilac: #393065; --sky: #1f3d55; --mint: #1d473a; --lemon: #4a4327;
    --src-article16: #ff9f8a; --src-opwdd: #bba5ff; --src-medicaid: #6fd4f6; --src-homecare: #7ee2ad; --src-registered: #f7a3cf; --src-aba: #f7c968; --src-cdpap: #5fd6c7;
    --shadow: 0 6px 20px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17142b; --panel: #211c3a; --ink: #f4f0ff; --muted: #b6aed9; --line: #342d58;
  --accent: #a993ff; --accent-ink: #17142b; --focus: #7b61ff;
  --peach: #4c3233; --pink: #4b2c46; --lilac: #393065; --sky: #1f3d55; --mint: #1d473a; --lemon: #4a4327;
  --src-article16: #ff9f8a; --src-opwdd: #bba5ff; --src-medicaid: #6fd4f6; --src-homecare: #7ee2ad; --src-registered: #f7a3cf; --src-aba: #f7c968; --src-cdpap: #5fd6c7;
  --shadow: 0 6px 20px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 10px; }
.icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- header ---------- */
.top {
  position: relative; background: var(--panel);
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 12px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top::after { /* pastel ribbon */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
  background: linear-gradient(90deg, var(--peach), var(--pink), var(--lilac), var(--sky), var(--mint), var(--lemon));
}
.logo {
  width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none;
  background: var(--lilac); color: var(--accent);
}
.logo .icon { width: 24px; height: 24px; }
.brand { min-width: 0; flex: 1 1 280px; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: 0.005em; line-height: 1.15; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.brand p b { color: var(--ink); }
/* About us: header button + pop-up card */
.about-btn {
  height: 42px; flex: none; border-radius: 14px; border: 0; cursor: pointer; padding: 0 14px 0 12px;
  background: var(--pink); color: var(--ink); font-weight: 800; font-size: 14px;
  display: inline-flex; align-items: center; gap: 6px; transition: transform 0.15s;
}
.about-btn:hover { transform: translateY(-1px); }
.about-btn .icon { width: 18px; height: 18px; color: #e0569a; }
.about {
  width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0; border: 0; border-radius: 24px;
  background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px rgb(43 37 80 / 0.35); overflow: auto;
}
.about::backdrop { background: rgb(43 37 80 / 0.35); backdrop-filter: blur(3px); }
.about .ribbon { height: 8px; background: linear-gradient(90deg, var(--peach), var(--pink), var(--lilac), var(--sky), var(--mint), var(--lemon)); }
.about .body { padding: 22px 24px 24px; display: grid; gap: 16px; }
.about h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 26px; display: flex; align-items: center; gap: 10px; padding-right: 36px; }
.about h2 .icon { width: 26px; height: 26px; color: #e0569a; }
.about .intro { margin: 0; color: var(--muted); font-size: 15px; }
.about .people { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.about .person { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: var(--tint); }
.about .avatar {
  width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--panel); font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--accent);
}
.about .person b { display: block; font-size: 16px; font-weight: 800; }
.about .person small { color: var(--muted); font-size: 13px; }
.about .story { display: grid; gap: 10px; font-size: 15px; line-height: 1.6; }
.about .story p { margin: 0; }
.about .signoff { margin: 0; font-family: var(--font-display); font-weight: 600; color: var(--accent); }
.about .close {
  position: absolute; top: 18px; right: 16px; width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--lilac); color: var(--ink); display: grid; place-items: center;
}
.about .close .icon { width: 16px; height: 16px; }
.theme-toggle {
  width: 42px; height: 42px; flex: none; border-radius: 14px; border: 0; cursor: pointer;
  background: var(--lilac); color: var(--accent); display: grid; place-items: center;
  transition: transform 0.15s, background 0.15s;
}
.theme-toggle:hover { transform: translateY(-1px) rotate(-8deg); }
/* Language menu: a globe and a plain select, styled like the theme toggle */
.lang { position: relative; flex: none; display: flex; align-items: center; height: 42px; border-radius: 14px;
  background: var(--lilac); color: var(--accent); }
.lang .icon { position: absolute; inset-inline-start: 11px; width: 20px; height: 20px; pointer-events: none; }
.lang select { appearance: none; -webkit-appearance: none; height: 42px; border: 0; border-radius: 14px; background: transparent;
  color: var(--ink); font: inherit; font-weight: 800; font-size: 14px; padding-inline: 38px 14px; cursor: pointer; max-width: 168px; }
.lang select:focus-visible { outline: 3px solid var(--focus); }
.lang option { color: #2b2550; background: #fff; }
/* Phones: just the globe (the menu still lists every language by name) */
@media (max-width: 640px) {
  .lang select { width: 44px; padding-inline: 0; color: transparent; }
  .lang .icon { inset-inline-start: 12px; }
}
.theme-toggle .icon { width: 22px; height: 22px; }
.theme-toggle .moon { display: none; }
.theme-toggle[data-mode="dark"] .sun { display: none; }
.theme-toggle[data-mode="dark"] .moon { display: block; }
.total {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 14px;
  background: var(--mint); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
}

/* ---------- layout ---------- */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 380px 1fr; }
.rail {
  min-height: 0; overflow-y: auto;
  padding-block: 18px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 22px;
  /* soft pastel wash down the sidebar: lilac, pink, peach, mint */
  background: linear-gradient(180deg, color-mix(in srgb, var(--lilac) 45%, var(--bg)), color-mix(in srgb, var(--pink) 40%, var(--bg)) 35%,
    color-mix(in srgb, var(--peach) 35%, var(--bg)) 65%, color-mix(in srgb, var(--mint) 40%, var(--bg)));
  background-attachment: local;
}
.mapwrap { min-height: 0; padding: 14px 14px 14px 0; display: flex; }
#map { flex: 1; border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); background: var(--sky); }

/* ---------- search ---------- */
.searchrow { display: flex; gap: 8px; }
.search { position: relative; flex: 1; min-width: 0; }
.search .icon { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; box-sizing: border-box; height: 46px; border-radius: 999px; border: 2px solid var(--line);
  background: var(--panel); color: var(--ink); font: inherit; font-size: 15px; padding-block: 0; padding-inline: 42px 40px;
  transition: border-color 0.15s;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--accent); }
.search input::-webkit-search-cancel-button { display: none; }
.clear {
  position: absolute; inset-inline-end: 8px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px;
  border: 0; border-radius: 50%; background: var(--lilac); cursor: pointer; display: grid; place-items: center;
}
.clear .icon { position: static; transform: none; width: 14px; height: 14px; color: var(--ink); }
.summary { margin-top: 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink); font-weight: 800; }

/* ---------- section titles ---------- */
.title {
  margin: 0 0 10px; font-family: var(--font-display); font-weight: 600; font-size: 17px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
}
.link { border: 0; background: none; color: var(--accent); cursor: pointer; font-weight: 800; font-size: 13px; padding: 2px 4px; }

/* ---------- area chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
/* Upstate regions: full-width cards with the region name over its offices */
.chip.wide { width: 100%; border-radius: 16px; padding: 8px 10px 8px 12px; text-align: left; }
.chip.wide .txt { flex: 1; min-width: 0; line-height: 1.25; }
.chip.wide .sub { display: block; font-weight: 600; font-size: 12px; color: var(--muted); }
.chip.wide { border-color: var(--tint, var(--lilac)); }
.chip.wide[aria-pressed="true"] { background: var(--tint, var(--lilac)); border-color: var(--tint, var(--lilac)); }
.chip.wide[aria-pressed="true"] .sub { color: var(--ink); opacity: 0.75; }
.region-label { color: var(--accent); font-family: var(--font-display); font-weight: 600; font-size: 13px; text-align: center; white-space: nowrap; pointer-events: none;
  text-shadow: 0 1px 0 var(--panel), 0 0 6px var(--panel), 0 0 10px var(--panel); }
.region-label em { display: block; font-style: normal; font-family: var(--font-body); font-weight: 700; font-size: 11px; color: var(--ink); }
#map:not(.show-region-labels) .region-label { display: none; }
.chip {
  border: 2px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 8px 6px 12px;
  font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: background 0.15s, border-color 0.15s;
}
.chip .n { background: var(--bg); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip .tick { display: none; width: 14px; height: 14px; }
.chip[aria-pressed="true"] { background: var(--lilac); border-color: var(--lilac); }
.chip[aria-pressed="true"] .tick { display: block; }
.chip[aria-pressed="true"] .n { background: var(--panel); color: var(--ink); }

/* ---------- sources ---------- */
.sources { display: grid; gap: 8px; }
.src {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; text-align: left;
  border: 2px solid transparent; background: color-mix(in srgb, var(--tint, var(--lilac)) 40%, var(--panel)); border-radius: 16px; padding: 10px 12px; cursor: pointer;
  box-shadow: 0 1px 0 var(--line);
}
.src b { font-weight: 800; }
.src small { display: block; color: var(--muted); font-size: 13px; }
.src .n { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); }
.src[aria-pressed="true"] { border-color: var(--accent); background: var(--tint, var(--lilac)); }
.src[aria-pressed="true"] .n { color: var(--ink); }
.bubble { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.bubble i { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 0.2); }

/* ---------- service groups ---------- */
.groups { display: grid; gap: 10px; }
.group { border-radius: 18px; padding: 4px 6px 8px; background: var(--tint); }
.group h3 { margin: 0; padding: 8px 6px 6px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; }
.group h3 .gicon { width: 30px; height: 30px; border-radius: 10px; background: var(--panel); display: grid; place-items: center; }
.group h3 label { flex: 1; cursor: pointer; }
.group h3 .n { color: var(--muted); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.svc {
  display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 10px; margin: 2px 0; cursor: pointer;
  font-size: 14px; border-radius: 12px; background: color-mix(in srgb, var(--panel) 72%, transparent);
}
.svc:hover { background: var(--panel); }
.svc .n { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.svc.zero { color: var(--muted); }
.svc small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
.svc .txt { min-width: 0; }
input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; flex: none; }

.empty-note { display: block; margin-top: 6px; color: var(--ink); background: var(--lemon); border-radius: 10px; padding: 6px 10px; }

.note { font-size: 13px; line-height: 1.55; margin: 0; background: var(--lemon); border-radius: 16px; padding: 12px 14px; }
.note b { font-weight: 800; }

/* ---------- map furniture ---------- */
.leaflet-container { background: var(--sky); font-family: var(--font-body); }
/* Pastel-soft street map, dark in dark mode. One filter on the whole tile layer: per-tile filters leave hairline seams
   on high-resolution phone screens (whole zoom levels, set on the map, keep the layer itself seamless) */
.leaflet-tile-pane { filter: saturate(0.55) brightness(1.06) contrast(0.94); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .leaflet-tile-pane { filter: invert(1) hue-rotate(200deg) brightness(0.8) contrast(0.85) saturate(0.6); } }
:root[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(200deg) brightness(0.8) contrast(0.85) saturate(0.6); }
.area-label { color: var(--muted); font-family: var(--font-display); font-size: 13px; font-weight: 600; white-space: nowrap; text-align: center; pointer-events: none; text-shadow: 0 1px 0 var(--panel), 0 0 6px var(--panel); }
.area-label em { display: block; font-style: normal; font-family: var(--font-body); font-weight: 700; font-size: 11px; }
.cluster {
  display: grid; place-items: center; border-radius: 50%; color: #2b2550; font-weight: 800; font-size: 13px;
  border: 3px solid #fff; box-shadow: 0 4px 12px rgb(43 37 80 / 0.25); font-variant-numeric: tabular-nums;
}
.cluster.s { background: #bdf2da; } .cluster.m { background: #c6ecff; } .cluster.l { background: #ffcfe6; }
.leaflet-bar { border: 0 !important; box-shadow: var(--shadow) !important; border-radius: 14px !important; overflow: hidden; }
.leaflet-bar a, .leaflet-bar a:hover { background: var(--panel); color: var(--ink); border-bottom-color: var(--line); width: 34px; height: 34px; line-height: 34px; }
/* Zoom buttons: bottom-left corner, large enough to tap comfortably */
/* (#map raises specificity above Leaflet's own touch-screen sizing) */
#map .leaflet-bottom.leaflet-left .leaflet-control-zoom { margin: 0 0 16px 16px; }
#map .leaflet-control-zoom a {
  width: 44px; height: 44px; line-height: 42px; font-size: 24px; font-weight: 700; font-family: var(--font-body);
}
#map .leaflet-control-zoom a:hover { background: var(--lilac); color: var(--accent); }
#map .leaflet-control-zoom a.leaflet-disabled { color: var(--muted); background: var(--panel); opacity: 0.5; }
/* "Double-click to zoom in" tip: top of the map, fades away after the first zoom */
.zoom-tip { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 800; pointer-events: none;
  background: color-mix(in srgb, var(--panel) 92%, transparent); color: var(--ink); box-shadow: var(--shadow);
  border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700; text-align: center; width: max-content;
  max-width: calc(100% - 24px); box-sizing: border-box; transition: opacity 0.6s; }
.zoom-tip.gone { opacity: 0; }
/* Keep the map credits clear of the zoom buttons */
#map .leaflet-bottom.leaflet-right .leaflet-control-attribution { max-width: calc(100vw - 120px); font-size: 11px; line-height: 1.4; }
.leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 85%, transparent) !important; color: var(--muted) !important; border-radius: 10px 0 0 0; }
.leaflet-control-attribution a { color: var(--accent) !important; }

.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); box-shadow: 0 10px 30px rgb(43 37 80 / 0.25); }
.leaflet-popup-content-wrapper { border-radius: 22px; padding: 0; overflow: hidden; }
.leaflet-popup-content { margin: 0; width: 310px !important; font-size: 14px; line-height: 1.45; }
.leaflet-container a.leaflet-popup-close-button { color: var(--ink); top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--panel); font-size: 18px; line-height: 24px; }
.pop .head { padding: 16px 40px 12px 16px; background: var(--tint); }
.pop h4 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.25; text-wrap: balance; }
.pop .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.badge { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: var(--panel); display: inline-flex; align-items: center; gap: 5px; }
.badge i { width: 8px; height: 8px; border-radius: 50%; }
.dir {
  display: inline-flex; align-items: center; gap: 6px; margin: 12px 16px 0; padding: 7px 14px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink) !important; font-weight: 800; text-decoration: none; font-size: 13px;
}
.dir .icon { width: 15px; height: 15px; }
.pop ul { list-style: none; margin: 0; padding: 12px 16px 16px; max-height: 250px; overflow-y: auto; display: grid; gap: 10px; }
.pop li { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; padding: 10px 12px; border-radius: 14px; background: var(--bg); }
.pop li .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
.pop li b { font-weight: 800; overflow-wrap: anywhere; }
.pop li b a { color: var(--accent); }
.pop li div { grid-column: 2; color: var(--muted); font-size: 13px; }
.pop li .site { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 3px 10px; border-radius: 999px;
  background: var(--lilac); color: var(--ink); font-weight: 800; font-size: 12.5px; text-decoration: none; overflow-wrap: anywhere; }
.pop li .site:hover { background: color-mix(in srgb, var(--accent) 22%, var(--lilac)); }
.pop li .site .icon { width: 13px; height: 13px; flex: none; }
.pop .office { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 800; color: var(--ink); background: var(--lemon); border-radius: 999px; padding: 1px 8px; }
.pop .hidden-note { color: var(--muted); font-size: 13px; padding: 0 16px 14px; }

  .about-btn span { display: none; }

<!-- Data as JSON: parsed with JSON.parse, which is much faster than an equivalent JavaScript literal -->
<script type="application/json" id="locations-data">__LOCATIONS_JSON__</script>
<script type="application/json" id="basemap-data">__BASEMAP_JSON__</script>
<script>
// The list and filters render straight away; the map is added once the deferred map library has loaded
// (deferred scripts run before DOMContentLoaded), so nobody waits on the map to start browsing.
(() => {
const LOCATIONS = JSON.parse(document.getElementById("locations-data").textContent);
const BASEMAP = JSON.parse(document.getElementById("basemap-data").textContent);
const DATA_DATE = /*__DATA_DATE__*/"";
const ABOUT = /*__ABOUT__*/null;

// ---------- languages ----------
// English is built in; the other languages (New York State's 12 language-access languages) load when chosen.
const I18N = /*__I18N__*/{ en: {}, langs: [] };
let lang = "en";
let dict = I18N.en;
const dictCache = { en: I18N.en };
/** Text for a key in the current language (English if missing), with {placeholders} filled in */
const t = (key, vars = {}) => (dict[key] ?? I18N.en[key] ?? key).replace(/\{(\w+)\}/g, (_m, v) => (vars[v] ?? ""));
const regionName = (r) => (/^Region (\d)$/.test(r) ? t("region", { n: r.slice(-1) }) : r);
const pageDir = () => (I18N.langs.find((l) => l.code === lang)?.dir ?? "ltr");

// The area filter shows the five OPWDD regions, in order. Each location's map area (a NYC borough, a Long Island
// county or an upstate region) belongs to one of them.
const REGIONS = ["Region 1", "Region 2", "Region 3", "Region 4", "Region 5"];
const REGION_TINTS = { "Region 1": "--pink", "Region 2": "--peach", "Region 3": "--lemon", "Region 4": "--mint", "Region 5": "--sky" };
const regionInfo = (r) => t(`regionInfo${r.slice(-1)}`);
const AREA_REGION = {
  Manhattan: "Region 4", Brooklyn: "Region 4", Bronx: "Region 4", Queens: "Region 4", "Staten Island": "Region 4",
  Nassau: "Region 5", Suffolk: "Region 5", "Region 1": "Region 1", "Region 2": "Region 2", "Region 3": "Region 3",
};
// Label positions for the regions on the statewide view (Regions 4 and 5 are labeled offshore, clear of the pins)
const REGION_LABELS = [
  { at: [42.3, -78.6], name: "Region 1", sub: true },
  { at: [43.55, -75.35], name: "Region 2", sub: true },
  { at: [42.15, -74.25], name: "Region 3", sub: true },
  { at: [40.4, -74.05], name: "Region 4", sub: false },
  { at: [40.55, -72.85], name: "Region 5", sub: false },
];
// Provider types: text comes from the language files (src.<key>, src.<key>.short, src.<key>.note)
const SOURCES = {
  article16: { tint: "--peach" }, opwdd: { tint: "--lilac" }, homecare: { tint: "--mint" }, cdpap: { tint: "--mint" },
  aba: { tint: "--lemon" }, registered: { tint: "--pink" }, medicaid: { tint: "--sky" },
};
const srcLabel = (s) => t(`src.${s}`), srcShort = (s) => t(`src.${s}.short`), srcNote = (s) => t(`src.${s}.note`);
// [service key in the data, label text key, hint text key]
const GROUPS = [
  { name: "grp.cdpap", icon: "i-hands", tint: "--mint", types: [
    ["CDPAP Facilitator (Developmental Disabilities Focus)", "svc.cdpapIdd", "svc.cdpapHint"],
    ["CDPAP Facilitator", "svc.cdpapOther", "svc.cdpapHint"]] },
  { name: "grp.aba", icon: "i-heart-solo", tint: "--lilac", types: [
    ["ABA Therapy (Straight Medicaid)", "svc.abaStraight", "svc.abaStraightHint"],
    ["ABA Therapy (Managed Medicaid Only)", "svc.abaManaged", "svc.abaManagedHint"]] },
  { name: "grp.home", icon: "i-home", tint: "--peach", types: [["Intermediate Care (ICF)", "svc.icf"], ["OPWDD Community Support Site", "svc.communitySupport"]] },
  { name: "grp.day", icon: "i-sun", tint: "--mint", types: [["Day Habilitation", "svc.dayHab"], ["Prevocational", "svc.prevoc"], ["Supported Employment", "svc.supportedEmployment"]] },
  { name: "grp.community", icon: "i-hands", tint: "--sky", types: [["Community Habilitation", "svc.communityHab"], ["Individual Support (ISS)", "svc.iss"], ["Self-Direction", "svc.selfDirection"], ["Family Support", "svc.familySupport"], ["Special Needs Home Health", "svc.homeHealth", "svc.homeHealthHint"]] },
  { name: "grp.clinics", icon: "i-heart", tint: "--pink", types: [["Article 16 Clinic", "svc.a16Main"], ["Article 16 Satellite", "svc.a16Satellite"], ["OPWDD State-Operated Clinic", "svc.stateClinic"], ["OPWDD Registered Therapy Practice", "svc.registered", "svc.registeredHint"]] },
];
const ALL_TYPES = GROUPS.flatMap((g) => g.types.map((x) => x[0]));
const LABEL_KEYS = Object.fromEntries(GROUPS.flatMap((g) => g.types.map((x) => [x[0], x[1]])));
const serviceLabel = (k) => (LABEL_KEYS[k] ? t(LABEL_KEYS[k]) : k);
const SOURCE_ORDER = ["article16", "opwdd", "homecare", "cdpap", "registered", "aba", "medicaid"];
let nf = new Intl.NumberFormat("en-US");
let colorCache = new Map();
const css = (name) => {
  if (!colorCache.has(name)) colorCache.set(name, getComputedStyle(document.documentElement).getPropertyValue(name).trim());
  return colorCache.get(name);
};
const srcColor = (s) => css(`--src-${s}`);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (id) => `<svg class="icon" aria-hidden="true"><use href="#${id}"/></svg>`;

LOCATIONS.forEach((loc, i) => {
  loc.id = i;
  loc.addrU = `${loc.a} ${loc.co || ""}`.toUpperCase(); // address plus county, so "Monroe" or "Albany" finds places
  loc.p.forEach((p) => { p.types = p.t.split(", "); p.nameU = p.n.toUpperCase(); });
  loc.primary = SOURCE_ORDER.find((s) => loc.p.some((p) => p.s === s));
});
const iddProviders = LOCATIONS.reduce((n, l) => n + l.p.length, 0);

const state = { q: "", regions: new Set(REGIONS), source: "all", types: new Set(ALL_TYPES) };

// ---------- filtering ----------
// Areas a location counts toward: its own, plus any area a provider there serves (home health agencies visit
// people at home across several areas)
function locRegions(loc) {
  if (!loc.regions) loc.regions = [...new Set([loc.r, ...loc.p.flatMap((p) => p.sv || [])].map((a) => AREA_REGION[a]))];
  return loc.regions;
}
const inSelectedRegions = (loc) => locRegions(loc).some((r) => state.regions.has(r));
function terms() { return state.q.trim().toUpperCase().split(/\s+/).filter(Boolean); }
function textMatch(p, loc, ts) { return !ts.length || ts.every((t) => p.nameU.includes(t) || loc.addrU.includes(t)); }
function providerMatches(p, loc, ts) {
  if (state.source !== "all" && p.s !== state.source) return false;
  if (!p.types.some((t) => state.types.has(t))) return false;
  return textMatch(p, loc, ts);
}
function visible() {
  const ts = terms();
  const out = [];
  for (const loc of LOCATIONS) {
    if (!inSelectedRegions(loc)) continue;
    const ps = loc.p.filter((p) => providerMatches(p, loc, ts));
    if (ps.length) out.push({ loc, ps });
  }
  return out;
}

// ---------- map ----------
let map = null, baseLayer = null, clusters = null;
const markers = new Map();

function basemapStyle() {
  return { color: css("--accent"), weight: 2, dashArray: "6 6", opacity: 0.7, fill: false };
}
// The map's tiles are 256-pixel squares placed at whole pixels inside the map. If the map box itself starts part-way
// through a pixel (the header above it is, say, 87.6px tall), every tile edge lands between screen pixels and
// phones and Retina screens draw a faint line along it. Nudge the map box onto whole pixels.
function snapMapToPixels() {
  const el = document.getElementById("map");
  el.style.transform = "";
  const r = el.getBoundingClientRect();
  const top = r.top + window.scrollY, left = r.left + window.scrollX;
  const dx = Math.round(left) - left, dy = Math.round(top) - top;
  if (dx || dy) el.style.transform = `translate(${dx}px, ${dy}px)`;
}

function regionLabelIcon(r) {
  return L.divIcon({ className: "region-label", html: `${esc(regionName(r.name))}${r.sub ? `<em>${esc(regionInfo(r.name))}</em>` : ""}`, iconSize: [190, 36], iconAnchor: [95, 18] });
}
// Map text that is set once when the map is made: region names and the zoom buttons
function translateMap() {
  if (!map) return;
  for (const r of REGION_LABELS) r.marker?.setIcon(regionLabelIcon(r));
  const zin = map.getContainer().querySelector(".leaflet-control-zoom-in"), zout = map.getContainer().querySelector(".leaflet-control-zoom-out");
  if (zin) { zin.title = t("zoomIn"); zin.setAttribute("aria-label", t("zoomIn")); }
  if (zout) { zout.title = t("zoomOut"); zout.setAttribute("aria-label", t("zoomOut")); }
  const tip = map.getContainer().querySelector(".zoom-tip");
  if (tip) tip.textContent = t(matchMedia("(pointer: coarse)").matches ? "zoomTipTouch" : "zoomTipMouse");
  map.closePopup();
}

function initMap() {
  // Move map layers with flat 2D transforms (Leaflet's own setting for browsers without 3D). 3D moves turn every
  // tile into its own graphics layer, and phones and Retina screens draw faint lines where those layers meet.
  // Zooming and panning stay animated.
  L.Browser.ie3d = true;
  snapMapToPixels();
  addEventListener("resize", snapMapToPixels);
  document.fonts?.ready.then(snapMapToPixels);
  // whole zoom levels only: in-between levels stretch the map tiles and leave faint seams between them
  map = L.map("map", { zoomControl: false, attributionControl: true, minZoom: 6, maxZoom: 18, zoomSnap: 1 })
    .fitBounds([[40.49, -79.77], [45.02, -71.85]]); // all of New York State
  L.control.zoom({ position: "bottomleft", zoomInTitle: t("zoomIn"), zoomOutTitle: t("zoomOut") }).addTo(map);
  map.attributionControl.setPrefix(false).addAttribution("Boundaries: U.S. Census TIGER via data.ny.gov");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);
  baseLayer = L.geoJSON(BASEMAP, { style: basemapStyle, interactive: false }).addTo(map);
  for (const r of REGION_LABELS) {
    r.marker = L.marker(r.at, { interactive: false, keyboard: false, icon: regionLabelIcon(r) }).addTo(map);
  }
  // Region names only on the zoomed-out statewide view, where they don't cover pins
  // region names on the zoomed-out statewide view, on screens wide enough that they don't cover the pins
  const toggleRegionLabels = () => map.getContainer().classList.toggle("show-region-labels", map.getZoom() <= 8 && map.getSize().x > 700);
  map.on("zoomend resize", toggleRegionLabels);
  toggleRegionLabels();
  clusters = L.markerClusterGroup({
    showCoverageOnHover: false, maxClusterRadius: 46, spiderfyOnMaxZoom: true, chunkedLoading: true,
    iconCreateFunction: (c) => {
      const n = c.getChildCount();
      const [size, cls] = n < 10 ? [34, "s"] : n < 50 ? [42, "m"] : [50, "l"];
      return L.divIcon({ html: `<div class="cluster ${cls}" style="width:${size}px;height:${size}px">${n}</div>`, className: "", iconSize: [size, size] });
    },
  });
  map.addLayer(clusters);
  addClickZoom();
  renderMap(visible());
}

// Zoom by clicking the map itself: double-click (or double-tap) zooms in on that spot, which Leaflet does already;
// right-click (or a two-finger tap on a phone) zooms out around that spot, like Google Maps
function addClickZoom() {
  map.on("contextmenu", (e) => map.setZoomAround(e.containerPoint, map.getZoom() - 1));

  const el = map.getContainer();
  let twoFinger = null;
  el.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      const [a, b] = e.touches;
      twoFinger = { at: Date.now(), x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2, gap: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) };
    } else if (e.touches.length > 2) twoFinger = null;
  }, { passive: true });
  el.addEventListener("touchmove", (e) => {
    // a pinch or a drag, not a tap
    if (!twoFinger || e.touches.length !== 2) return;
    const [a, b] = e.touches;
    const gap = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (Math.abs(gap - twoFinger.gap) > 12 || Math.hypot((a.clientX + b.clientX) / 2 - twoFinger.x, (a.clientY + b.clientY) / 2 - twoFinger.y) > 12) twoFinger = null;
  }, { passive: true });
  el.addEventListener("touchend", (e) => {
    if (twoFinger && e.touches.length === 0 && Date.now() - twoFinger.at < 350) {
      const box = el.getBoundingClientRect();
      map.setZoomAround(L.point(twoFinger.x - box.left, twoFinger.y - box.top), map.getZoom() - 1);
    }
    if (e.touches.length === 0) twoFinger = null;
  }, { passive: true });

  // A short tip on the map until the visitor first zooms (remembered on this device)
  let seen = false;
  try { seen = localStorage.getItem("zoomTipSeen") === "1"; } catch {}
  if (seen) return;
  const touch = matchMedia("(pointer: coarse)").matches;
  const tip = document.createElement("div");
  tip.className = "zoom-tip";
  tip.setAttribute("aria-hidden", "true");
  tip.textContent = t(touch ? "zoomTipTouch" : "zoomTipMouse");
  el.appendChild(tip);
  const hide = () => {
    tip.classList.add("gone");
    setTimeout(() => tip.remove(), 700);
    try { localStorage.setItem("zoomTipSeen", "1"); } catch {}
  };
  map.once("zoomstart", () => map.once("zoomend", hide));
  setTimeout(() => tip.classList.add("gone"), 9000);
}

function popupHTML(loc, ps) {
  const hidden = loc.p.length - ps.length;
  const sources = SOURCE_ORDER.filter((s) => loc.p.some((p) => p.s === s));
  const dir = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(loc.a)}`;
  return `<div class="pop" dir="${pageDir()}">
    <div class="head" style="--tint:var(${SOURCES[loc.primary].tint})">
      <h4>${esc(loc.a)}</h4>
      <div class="meta">${sources.map((s) => `<span class="badge"><i style="background:${srcColor(s)}"></i>${esc(srcShort(s))}</span>`).join("")}
        <span class="badge">${esc(`${regionName(AREA_REGION[loc.r])}${loc.co ? ` · ${t("county", { name: loc.co })}` : ""}`)}</span></div>
    </div>
    <a class="dir" href="${dir}" target="_blank" rel="noopener noreferrer">${icon("i-go")}${esc(t("directions"))}</a>
    <ul>${ps.map((p) => `<li><span class="dot" style="background:${srcColor(p.s)}"></span>
      <b>${p.w ? `<a href="${esc(/^https?:/i.test(p.w) ? p.w : "https://" + p.w)}" target="_blank" rel="noopener noreferrer">${esc(p.n)}</a>` : esc(p.n)}</b>
      <div>${esc(p.types.map(serviceLabel).join(", "))}</div>
      ${p.d ? `<div>${esc(p.d)}</div>` : ""}
      ${p.w ? `<div>${websiteLink(p.w)}</div>` : ""}
      ${p.sv ? `<div>${servesText(p)}</div>` : ""}
      ${p.o ? `<div><span class="office">${esc(t("officeAddress"))}</span></div>` : ""}
      ${p.u ? `<div><span class="office">${esc(t("unconfirmed"))}</span></div>` : ""}</li>`).join("")}</ul>
    ${hidden > 0 ? `<div class="hidden-note">${esc(hidden === 1 ? t("hiddenOne") : t("hiddenMany", { n: nf.format(hidden) }))}</div>` : ""}
  </div>`;
}

// Areas a provider serves beyond its office: all five OPWDD regions read as "all of New York State"
function servesText(p) {
  const regions = [...new Set(p.sv.map((a) => AREA_REGION[a]))];
  const where = regions.length === REGIONS.length ? t("allNY") : p.sv.map(regionName).join(", ");
  return esc(t(p.s === "cdpap" ? "serves" : "visits", { where }));
}

// "Website" pill under each provider. State-run sites and the DOH profile page get plain-language labels.
function websiteLink(w) {
  const url = /^https?:/i.test(w) ? w : "https://" + w;
  let label;
  try { label = new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; }
  if (label === "opwdd.ny.gov") label = t("websiteOpwdd");
  else if (label === "profiles.health.ny.gov") label = t("websiteDoh");
  else label = t("website", { host: label });
  return `<a class="site" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${icon("i-globe")}${esc(label)}</a>`;
}

function renderMap(items) {
  if (!clusters) return; // map library still loading; initMap() draws the pins when it arrives
  clusters.clearLayers();
  markers.clear();
  const layers = items.map(({ loc, ps }) => {
    const m = L.circleMarker(loc.c, {
      radius: 8, weight: 3, color: "#ffffff", fillColor: srcColor(loc.primary), fillOpacity: 1,
    });
    m.bindPopup(() => popupHTML(loc, ps), { maxWidth: 340, autoPanPadding: [28, 28] });
    markers.set(loc.id, m);
    return m;
  });
  clusters.addLayers(layers);
}

// ---------- sidebar ----------
const $ = (id) => document.getElementById(id);

function renderSidebar(items) {
  const ts = terms();
  const providerCount = items.reduce((n, it) => n + it.ps.length, 0);
  $("summary").innerHTML = t("summary", { places: nf.format(items.length), providers: nf.format(providerCount) })
    + (items.length === 0 ? `<span class="empty-note">${esc(t("noMatches"))}</span>` : "");

  // Areas: locations that match every other filter
  const areaCounts = Object.fromEntries(REGIONS.map((r) => [r, 0]));
  for (const loc of LOCATIONS) if (loc.p.some((p) => providerMatches(p, loc, ts))) locRegions(loc).forEach((r) => areaCounts[r]++);
  $("areas").innerHTML = `<div class="chips">${REGIONS.map((r) => `<button type="button" class="chip wide" data-region="${r}" style="--tint:var(${REGION_TINTS[r]})" aria-pressed="${state.regions.has(r)}">`
    + `<svg class="icon tick" aria-hidden="true"><use href="#i-check"/></svg>`
    + `<span class="txt">${esc(regionName(r))}<span class="sub">${esc(regionInfo(r))}</span></span>`
    + `<span class="n">${nf.format(areaCounts[r])}</span></button>`).join("")}</div>`;
  $("allAreas").hidden = state.regions.size === REGIONS.length;

  // Sources: providers in the selected areas that match services + search
  const srcCounts = Object.fromEntries(SOURCE_ORDER.map((s) => [s, 0]));
  let allCount = 0;
  for (const loc of LOCATIONS) {
    if (!inSelectedRegions(loc)) continue;
    for (const p of loc.p) {
      if (!p.types.some((t) => state.types.has(t)) || !textMatch(p, loc, ts)) continue;
      srcCounts[p.s]++; allCount++;
    }
  }
  const rainbow = `background:conic-gradient(${SOURCE_ORDER.map((s, i) => `${srcColor(s)} ${(i * 360) / SOURCE_ORDER.length}deg ${((i + 1) * 360) / SOURCE_ORDER.length}deg`).join(",")})`;
  $("sources").innerHTML = `<button type="button" class="src" data-source="all" style="--tint:var(--lemon)" aria-pressed="${state.source === "all"}">
      <span class="bubble" style="background:var(--lemon)"><i style="${rainbow}"></i></span><span><b>${esc(t("everyone"))}</b><small>${esc(t("everyoneNote"))}</small></span><span class="n">${nf.format(allCount)}</span></button>`
    + SOURCE_ORDER.map((s) => `<button type="button" class="src" data-source="${s}" style="--tint:var(${SOURCES[s].tint})" aria-pressed="${state.source === s}">
        <span class="bubble" style="background:var(${SOURCES[s].tint})"><i style="background:${srcColor(s)}"></i></span>
        <span><b>${esc(srcLabel(s))}</b><small>${esc(srcNote(s))}</small></span><span class="n">${nf.format(srcCounts[s])}</span></button>`).join("");

  // Services: locations in the selected areas/source/search offering each service, and each group
  const typeCounts = Object.fromEntries(ALL_TYPES.map((t) => [t, 0]));
  const groupCounts = GROUPS.map(() => 0);
  for (const loc of LOCATIONS) {
    if (!inSelectedRegions(loc)) continue;
    const offered = new Set();
    for (const p of loc.p) {
      if (state.source !== "all" && p.s !== state.source) continue;
      if (!textMatch(p, loc, ts)) continue;
      p.types.forEach((t) => offered.add(t));
    }
    offered.forEach((t) => { if (t in typeCounts) typeCounts[t]++; });
    GROUPS.forEach((g, gi) => { if (g.types.some(([k]) => offered.has(k))) groupCounts[gi]++; });
  }
  $("groups").innerHTML = GROUPS.map((g, gi) => {
    const keys = g.types.map((t) => t[0]);
    const on = keys.filter((k) => state.types.has(k)).length;
    return `<div class="group" style="--tint:var(${g.tint})">
      <h3><span class="gicon">${icon(g.icon)}</span><label for="g${gi}">${esc(t(g.name))}</label>
        <span class="n">${nf.format(groupCounts[gi])}</span>
        <input type="checkbox" id="g${gi}" data-group="${gi}" ${on === keys.length ? "checked" : ""} aria-label="${esc(t("allOf", { name: t(g.name) }))}"></h3>
      ${g.types.map(([k, label, hint], ti) => `<label class="svc ${typeCounts[k] ? "" : "zero"}" for="t${gi}-${ti}"><input type="checkbox" id="t${gi}-${ti}" data-type="${esc(k)}" ${state.types.has(k) ? "checked" : ""}>`
          + `<span class="txt">${esc(label ? t(label) : k)}${hint ? `<small>${esc(t(hint))}</small>` : ""}</span>`
          + `<span class="n">${nf.format(typeCounts[k])}</span></label>`).join("")}
    </div>`;
  }).join("");
  GROUPS.forEach((g, gi) => {
    const keys = g.types.map((t) => t[0]);
    const on = keys.filter((k) => state.types.has(k)).length;
    $(`g${gi}`).indeterminate = on > 0 && on < keys.length;
  });
}

function render() {
  $("total").textContent = t("total", { n: nf.format(iddProviders) });
  const items = visible();
  renderMap(items);
  renderSidebar(items);
  return items;
}

// After a search, bring the matching places into view
function zoomToMatches(items) {
  if (!map || !state.q.trim() || items.length === 0) return;
  map.fitBounds(L.latLngBounds(items.map(({ loc }) => loc.c)), { maxZoom: 15, padding: [48, 48] });
}

// ---------- events ----------
let timer;
$("q").addEventListener("input", (e) => {
  state.q = e.target.value;
  $("clear").hidden = !state.q;
  clearTimeout(timer);
  timer = setTimeout(() => zoomToMatches(render()), 250);
});
$("clear").addEventListener("click", () => { $("q").value = ""; state.q = ""; $("clear").hidden = true; render(); $("q").focus(); });
$("areas").addEventListener("click", (e) => {
  const b = e.target.closest("[data-region]"); if (!b) return;
  const r = b.dataset.region;
  if (state.regions.has(r)) state.regions.delete(r); else state.regions.add(r);
  render();
});
$("allAreas").addEventListener("click", () => { state.regions = new Set(REGIONS); render(); });
$("sources").addEventListener("click", (e) => {
  const b = e.target.closest("[data-source]"); if (!b) return;
  state.source = b.dataset.source; render();
});
$("groups").addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.type) { if (t.checked) state.types.add(t.dataset.type); else state.types.delete(t.dataset.type); }
  else if (t.dataset.group) { GROUPS[+t.dataset.group].types.forEach(([k]) => t.checked ? state.types.add(k) : state.types.delete(k)); }
  render();
});
$("svcAll").addEventListener("click", () => { state.types = new Set(ALL_TYPES); render(); });
$("svcNone").addEventListener("click", () => { state.types = new Set(); render(); });

// About us (hidden until site/about.json is filled in). Opens from the header button or a link to #about.
if (ABOUT) {
  const dialog = $("about");
  const tints = ["--peach", "--sky", "--mint", "--pink", "--lemon", "--lilac"];
  const initials = (name) => name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
  $("aboutTitle").querySelector("span").textContent = ABOUT.heading;
  $("aboutIntro").textContent = ABOUT.intro; $("aboutIntro").hidden = !ABOUT.intro;
  $("aboutPeople").innerHTML = ABOUT.people.map((p, i) => `<div class="person" style="--tint:var(${tints[i % tints.length]})">`
    + `<span class="avatar" aria-hidden="true">${esc(initials(p.name))}</span><span><b>${esc(p.name)}</b>${p.role ? `<small>${esc(p.role)}</small>` : ""}</span></div>`).join("");
  $("aboutStory").innerHTML = ABOUT.story.map((para) => `<p>${esc(para)}</p>`).join("");
  $("aboutSignoff").textContent = ABOUT.signoff; $("aboutSignoff").hidden = !ABOUT.signoff;
  const open = () => { if (!dialog.open) dialog.showModal(); };
  $("aboutBtn").hidden = false;
  $("aboutBtn").addEventListener("click", open);
  $("aboutClose").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close(); }); // click outside the card
  dialog.addEventListener("close", () => { if (location.hash === "#about") history.replaceState(null, "", location.pathname); });
  const fromHash = () => { if (location.hash === "#about") open(); };
  window.addEventListener("hashchange", fromHash);
  fromHash();
}

// Light / dark toggle. The icon shows the current mode; a click switches to the other one and remembers it.
const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
const currentTheme = () => document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light");
function syncThemeButton() {
  const mode = currentTheme(), next = mode === "dark" ? "light" : "dark";
  const btn = $("themeToggle");
  btn.dataset.mode = mode;
  btn.setAttribute("aria-label", t(next === "dark" ? "themeDark" : "themeLight"));
  btn.title = t(next === "dark" ? "themeDark" : "themeLight");
  document.querySelector('meta[name="theme-color"]').content = mode === "dark" ? "#17142b" : "#fdf8ff";
}
$("themeToggle").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; // the observer below re-colors the map
  try { localStorage.setItem("theme", next); } catch {}
  syncThemeButton();
});
darkQuery.addEventListener("change", syncThemeButton);
syncThemeButton();

// Re-color the map when the viewer's theme changes
const recolor = () => { colorCache = new Map(); if (baseLayer) baseLayer.setStyle(basemapStyle); render(); };
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", recolor);
new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// ---------- language menu ----------
// Page text that is not drawn by render(): header, headings, search box and labels
function translateStatic() {
  document.documentElement.lang = lang;
  document.documentElement.dir = pageDir();
  $("siteTitle").textContent = t("title");
  $("tagline").innerHTML = t("tagline");
  $("whereTitle").textContent = t("where");
  $("allAreas").textContent = t("showAllRegions");
  $("whichKindTitle").textContent = t("whichKind");
  $("whatServicesTitle").textContent = t("whatServices");
  $("svcAll").textContent = t("all");
  $("svcNone").textContent = t("none");
  $("q").placeholder = t("searchPlaceholder");
  $("q").setAttribute("aria-label", t("searchLabel"));
  $("clear").setAttribute("aria-label", t("clearSearch"));
  document.querySelector(".rail").setAttribute("aria-label", t("filtersLabel"));
  $("map").setAttribute("aria-label", t("mapLabel"));
  $("langSelect").setAttribute("aria-label", t("language"));
  $("langSelect").parentElement.title = t("language");
  $("goodToKnow").innerHTML = t("note", { date: esc(DATA_DATE) }) + (lang === "en" ? "" : ` ${esc(t("englishData"))}`);
  syncThemeButton();
}

async function setLanguage(code) {
  const info = I18N.langs.find((l) => l.code === code);
  if (!info) code = "en";
  if (!dictCache[code]) {
    try { dictCache[code] = await (await fetch(info.url)).json(); }
    catch { code = "en"; } // offline or blocked: stay in English
  }
  lang = code;
  dict = dictCache[code];
  nf = new Intl.NumberFormat(["ht", "yi"].includes(code) ? "en-US" : code);
  $("langSelect").value = code;
  try { localStorage.setItem("lang", code); } catch {}
  translateStatic();
  translateMap();
  render();
}

$("langSelect").innerHTML = I18N.langs.map((l) => `<option value="${l.code}" lang="${l.code}">${esc(l.name)}</option>`).join("");
$("langSelect").addEventListener("change", (e) => setLanguage(e.target.value));
let savedLang = "en";
try { savedLang = localStorage.getItem("lang") || "en"; } catch {}
translateStatic();
render();
if (savedLang !== "en") setLanguage(savedLang);
if (window.L && L.markerClusterGroup) initMap();
else document.addEventListener("DOMContentLoaded", initMap);
})();
</script>
</body>
