<html lang="en">

<style>
*, *::before, *::after { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one calm column, a "today" card on top and the garden bed below, big touch targets everywhere */
:root {
  --bg: #f5f8f2;          /* pale leaf */
  --leaf-ink: #4f7d3f;    /* green for text on light grounds */
  --card: #ffffff;
  --fg: #263329;          /* deep moss */
  --muted: #5d6e60;
  --line: #d9e5d3;
  --soil: #ead7c3;
  --soil-dark: #cfb39a;
  --sky: #e6f3fc;
  --accent: #bfe6ad;      /* pastel garden green */
  --accent-ink: #263329;
  --focus: #2f6fd6;
  --happy: #ffe28f; --calm: #aedcf3; --okay: #c4ebbd; --tired: #d8ccf5; --sad: #b5c9f2; --worried: #fbcdb0; --angry: #f8b4b8;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 22px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17211a; --card: #202c23; --fg: #eef5ea; --muted: #b4c4b0; --line: #34453a; --soil: #6f5643; --soil-dark: #574234;
  --sky: #1d2c38; --accent: #9fd27f; --accent-ink: #142016; --focus: #8bb8ff; --leaf-ink: #a9db8c; color-scheme: dark } }
:root[data-theme="dark"] {
  --leaf-ink: #a9db8c; --bg: #17211a; --card: #202c23; --fg: #eef5ea; --muted: #b4c4b0; --line: #34453a; --soil: #6f5643; --soil-dark: #574234;
  --sky: #1d2c38; --accent: #9fd27f; --accent-ink: #142016; --focus: #8bb8ff; color-scheme: dark }

html, body { height: auto; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 18px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2 { font-family: var(--display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 6vw, 2.8rem); }
h2 { font-size: 1.5rem; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* Opened from the iPhone home screen: no rubber-band bounce past the page, and room for the home indicator */
@media (display-mode: standalone) { html, body { overscroll-behavior: none; } body { padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); } }
button:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
header .sprout { width: 56px; height: 56px; flex: none; }
header .titles { flex: 1; min-width: 0; }
header .sub { color: var(--muted); }
.date { font-weight: 700; color: var(--leaf-ink); }

.card { background: var(--card); border-radius: var(--radius); padding: 22px; display: grid; gap: 16px; box-shadow: 0 2px 0 var(--line); }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row h2 { flex: 1; min-width: 0; }
.speak { border: 0; background: var(--sky); border-radius: 999px; padding: 10px 16px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; min-height: 48px; }
.speak svg { width: 22px; height: 22px; }

.feelings { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.feeling { border: 3px solid transparent; border-radius: 20px; background: color-mix(in srgb, var(--c) 45%, var(--card)); padding: 14px 8px 12px;
  display: grid; justify-items: center; gap: 6px; font-weight: 700; font-size: 1.1rem; min-height: 132px; transition: transform .15s; }
.feeling:hover { transform: translateY(-2px); }
.feeling[aria-pressed="true"] { border-color: var(--fg); background: color-mix(in srgb, var(--c) 80%, var(--card)); }
.feeling svg { width: 70px; height: 70px; }

.reply { border-radius: 18px; padding: 16px 18px; background: color-mix(in srgb, var(--c, var(--okay)) 40%, var(--card)); display: grid; gap: 6px; }
.reply .big { font-family: var(--display); font-size: 1.35rem; font-weight: 600; }
.reply .help { color: var(--muted); font-size: 1rem; }
.choices { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 700; min-height: 56px; background: var(--accent); color: var(--accent-ink); font-size: 1.05rem; }
.btn.soft { background: var(--sky); color: var(--fg); }

/* activities */
.activity { display: grid; justify-items: center; gap: 14px; padding: 8px 0; text-align: center; }
.breath { width: min(240px, 70vw); aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; }
.breath .petal-ring { width: 40%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--happy) 0 30%, color-mix(in srgb, var(--c, var(--calm)) 80%, white) 31%);
  box-shadow: 0 0 0 12px color-mix(in srgb, var(--c, var(--calm)) 30%, transparent); transition: width 4s ease-in-out; }
.breath.in .petal-ring { width: 92%; }
.breath-text { font-family: var(--display); font-size: 1.6rem; font-weight: 800; min-height: 2.2rem; }
.bubbles { position: relative; width: 100%; height: 260px; border-radius: 18px; background: var(--sky); overflow: hidden; }
.bubble { position: absolute; width: 64px; height: 64px; border-radius: 50%; border: 0; padding: 0;
  background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.9) 0 12%, color-mix(in srgb, var(--c, var(--calm)) 70%, white) 13% 60%, color-mix(in srgb, var(--c, var(--calm)) 90%, transparent) 61%);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); animation: float 3.2s ease-in-out infinite alternate; }
.bubble.popped { animation: pop .3s forwards; pointer-events: none; }
@keyframes float { to { transform: translateY(-10px); } }
@keyframes pop { to { transform: scale(1.6); opacity: 0; } }
.count { color: var(--muted); font-weight: 700; }

/* garden */
.bed { border-radius: 20px; overflow: hidden; background: linear-gradient(var(--sky) 0 62%, var(--soil) 62% 100%); }
.bed svg { display: block; width: 100%; height: auto; }
.empty { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: .95rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); display: inline-block; }
.picked { font-size: 1rem; min-height: 1.5em; }
.status { color: var(--muted); font-size: .9rem; }
.flower { cursor: pointer; }
.flower:focus, .flower:focus-visible { outline: none; }
.flower:focus-visible .head { stroke: var(--focus); stroke-width: 4; }

@media (prefers-reduced-motion: reduce) {
  .feeling, .breath .petal-ring { transition: none; }
  .bubble { animation: none; }
  .bubble.popped { animation: none; opacity: 0; }
}
/* install tip */
.install { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: color-mix(in srgb, var(--calm) 35%, var(--card)); }
.install p { flex: 1; min-width: 14rem; }
.install .x { border: 0; background: transparent; font-weight: 700; color: var(--muted); min-height: 48px; padding: 0 10px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="sprout" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="28" fill="var(--okay)"/><path d="M28 44V26" stroke="#6fae5c" stroke-width="4" stroke-linecap="round"/><path d="M28 30c-9 0-13-6-13-12 8 0 13 4 13 12zM28 26c0-8 5-13 13-13 0 7-4 13-13 13z" fill="#6fae5c"/></svg>
    <div class="titles">
      <h1>Feelings Garden</h1>
      <p class="sub">Check in each day. Every feeling plants a flower. <span class="date" id="today"></span></p>
    </div>
  </header>

  <section class="card install" id="installTip" hidden>
    <p id="installText">Add Feelings Garden to your home screen to open it like an app.</p>
    <button type="button" class="btn" id="installBtn" hidden>Install app</button>
    <button type="button" class="x" id="installClose">Not now</button>
  </section>

  <section class="card" aria-labelledby="askTitle">
    <div class="row">
      <h2 id="askTitle">How are you feeling today?</h2>
      <button class="speak" id="readAloud" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>Read to me</button>
    </div>
    <div class="feelings" id="feelings" role="group" aria-label="Feelings"></div>
    <div id="step" aria-live="polite"></div>
  </section>

  <section class="card" aria-labelledby="gardenTitle">
    <div class="row"><h2 id="gardenTitle">My garden</h2><span class="status" id="status"></span></div>
    <div class="bed" id="bed"></div>
    <p class="picked" id="picked"></p>
    <div class="legend" id="legend"></div>
  </section>
</div>

<script>
(() => {
// ---------- feelings ----------
// mouth: path for the face; reply: what the garden says back; help: an extra gentle line for hard feelings
const FEELINGS = [
  { id: "happy", label: "Happy", mouth: "M22 40c5 7 21 7 26 0", eyes: "open", reply: "Yay! Happy days help flowers grow tall.", activity: "bubbles" },
  { id: "calm", label: "Calm", mouth: "M24 41c4 3 18 3 22 0", eyes: "soft", reply: "Calm is a lovely feeling. Let's keep it going.", activity: "breathe" },
  { id: "okay", label: "Okay", mouth: "M25 42h20", eyes: "open", reply: "Okay is okay. Thanks for checking in.", activity: "bubbles" },
  { id: "tired", label: "Tired", mouth: "M27 43c3-2 13-2 16 0", eyes: "closed", reply: "Being tired is hard. Let's take it slow.", activity: "breathe" },
  { id: "sad", label: "Sad", mouth: "M23 46c5-7 19-7 24 0", eyes: "open", reply: "It's okay to feel sad. You are not alone.", help: "Talking to someone you trust can help too.", activity: "breathe" },
  { id: "worried", label: "Worried", mouth: "M24 44c3-3 6 2 9 0s6-3 9 0", eyes: "wide", reply: "Worried feelings feel big. Let's breathe slowly together.", help: "Talking to someone you trust can help too.", activity: "breathe" },
  { id: "angry", label: "Angry", mouth: "M24 45c5-5 17-5 22 0", eyes: "angry", reply: "Angry feelings are strong. Let's let some out with slow breaths.", help: "If you feel unsafe, tell a trusted person right away.", activity: "breathe" },
];
const byId = Object.fromEntries(FEELINGS.map((f) => [f.id, f]));
const col = (id) => `var(--${id})`;

function face(f) {
  const eye = {
    open: '<circle cx="25" cy="29" r="3.4"/><circle cx="45" cy="29" r="3.4"/>',
    wide: '<circle cx="25" cy="29" r="4.2"/><circle cx="45" cy="29" r="4.2"/>',
    soft: '<path d="M21 30c2-3 6-3 8 0M41 30c2-3 6-3 8 0" fill="none" stroke="#263329" stroke-width="3" stroke-linecap="round"/>',
    closed: '<path d="M21 29h8M41 29h8" stroke="#263329" stroke-width="3" stroke-linecap="round"/>',
    angry: '<path d="M20 23l9 4M50 23l-9 4" stroke="#263329" stroke-width="3" stroke-linecap="round"/><circle cx="25" cy="31" r="3.2"/><circle cx="45" cy="31" r="3.2"/>',
  }[f.eyes];
  return `<svg viewBox="0 0 70 70" aria-hidden="true"><circle cx="35" cy="35" r="32" fill="${col(f.id)}" stroke="#263329" stroke-opacity=".15" stroke-width="2"/><g fill="#263329">${eye}</g><path d="${f.mouth}" fill="none" stroke="#263329" stroke-width="3.2" stroke-linecap="round"/></svg>`;
}

// ---------- state ----------
// garden: { flowers: [{ d: "YYYY-MM-DD", f: feeling id, bloom: true|false }] } — one flower per day
let garden = { flowers: [] };
const todayKey = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`; };
const nice = (d) => new Date(`${d}T12:00:00`).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Saving: the garden stays on this device (nothing is sent anywhere)
const LOCAL = "feelingsGarden.v1";
function save() { try { localStorage.setItem(LOCAL, JSON.stringify(garden)); } catch {} }
function loadLocal() { try { const g = JSON.parse(localStorage.getItem(LOCAL) || "null"); if (g && Array.isArray(g.flowers)) garden = g; } catch {} }
loadLocal();
$("status").textContent = "Saved on this device";
// Ask the browser to keep the garden even when the phone is low on space
try { navigator.storage?.persist?.(); } catch {}

// ---------- read aloud ----------
let speakFn = null;
if ("speechSynthesis" in window) {
  speakFn = (text) => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; speechSynthesis.speak(u); } catch {} };
  $("readAloud").hidden = false;
}
let lastSpoken = "How are you feeling today? Pick the face that matches how you feel.";
$("readAloud").addEventListener("click", () => speakFn?.(lastSpoken));

// ---------- check-in ----------
let current = null;
function renderFeelings() {
  const today = garden.flowers.find((x) => x.d === todayKey());
  $("feelings").innerHTML = FEELINGS.map((f) => `<button type="button" class="feeling" data-f="${f.id}" style="--c:${col(f.id)}" aria-pressed="${today?.f === f.id}">${face(f)}<span>${f.label}</span></button>`).join("");
}
$("feelings").addEventListener("click", (e) => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  pick(byId[b.dataset.f]);
});

function pick(f) {
  current = f;
  const d = todayKey();
  const existing = garden.flowers.find((x) => x.d === d);
  if (existing) { existing.f = f.id; existing.bloom = false; } else garden.flowers.push({ d, f: f.id, bloom: false });
  garden.flowers.sort((a, b) => a.d.localeCompare(b.d));
  save();
  renderFeelings(); renderGarden();
  lastSpoken = `${f.reply} ${f.help ?? ""} Let's do a calm activity to help your flower bloom.`;
  $("step").innerHTML = `<div class="reply" style="--c:${col(f.id)}">
      <p class="big">${f.reply}</p>
      ${f.help ? `<p class="help">${f.help}</p>` : ""}
      <p>A ${f.label.toLowerCase()} flower is planted. Do a calm activity to help it bloom:</p>
      <div class="choices">
        <button type="button" class="btn" data-act="${f.activity}">${f.activity === "breathe" ? "Breathe with the flower" : "Pop the bubbles"}</button>
        <button type="button" class="btn soft" data-act="${f.activity === "breathe" ? "bubbles" : "breathe"}">${f.activity === "breathe" ? "Pop the bubbles" : "Breathe with the flower"}</button>
      </div>
    </div>`;
}

$("step").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "breathe") breathe(); else if (b.dataset.act === "bubbles") bubbles(); else if (b.dataset.act === "again") { $("step").innerHTML = ""; current = null; }
});

// ---------- activities ----------
function breathe() {
  const rounds = 3;
  $("step").innerHTML = `<div class="activity" style="--c:${col(current.id)}">
    <div class="breath" id="breath"><div class="petal-ring"></div></div>
    <p class="breath-text" id="breathText">Get ready…</p>
    <p class="count" id="breathCount">3 slow breaths</p>
  </div>`;
  lastSpoken = "Breathe with the flower. Breathe in while it grows, and breathe out while it gets small.";
  let i = 0;
  const el = $("breath"), txt = $("breathText"), cnt = $("breathCount");
  const step = () => {
    if (!document.body.contains(el)) return;
    if (i >= rounds * 2) return done("You breathed like a flower!");
    const inhale = i % 2 === 0;
    el.classList.toggle("in", inhale);
    txt.textContent = inhale ? "Breathe in…" : "Breathe out…";
    cnt.textContent = `Breath ${Math.floor(i / 2) + 1} of ${rounds}`;
    i++;
    setTimeout(step, 4000);
  };
  setTimeout(step, reduceMotion ? 300 : 1200);
}

function bubbles() {
  const n = 8;
  $("step").innerHTML = `<div class="activity" style="--c:${col(current.id)}">
    <p class="breath-text">Pop all the bubbles</p>
    <div class="bubbles" id="bubbles" role="group" aria-label="Bubbles"></div>
    <p class="count" id="bubbleCount">${n} bubbles left</p>
  </div>`;
  lastSpoken = "Pop all the bubbles. Take your time.";
  const box = $("bubbles");
  const w = box.clientWidth, h = box.clientHeight;
  let left = n;
  for (let k = 0; k < n; k++) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "bubble"; b.setAttribute("aria-label", `Bubble ${k + 1}`);
    const cols = Math.max(3, Math.floor(w / 90));
    b.style.left = `${((k % cols) + 0.5) * (w / cols) - 32 + (Math.random() * 20 - 10)}px`;
    b.style.top = `${(Math.floor(k / cols) + 0.5) * (h / Math.ceil(n / cols)) - 32 + (Math.random() * 16 - 8)}px`;
    b.style.animationDelay = `${(k * 0.37) % 2}s`;
    b.addEventListener("click", () => {
      b.classList.add("popped"); b.disabled = true; left--;
      $("bubbleCount").textContent = left ? `${left} bubble${left === 1 ? "" : "s"} left` : "All popped!";
      if (!left) setTimeout(() => done("You popped them all!"), 350);
    });
    box.appendChild(b);
  }
}

function done(msg) {
  const today = garden.flowers.find((x) => x.d === todayKey());
  if (today) today.bloom = true;
  save(); renderGarden();
  lastSpoken = `${msg} Your flower bloomed. Come back tomorrow to plant another one.`;
  $("step").innerHTML = `<div class="reply" style="--c:${col(current.id)}">
    <p class="big">${msg} Your flower bloomed.</p>
    <p>Come back tomorrow to plant another one.</p>
    <div class="choices"><button type="button" class="btn soft" data-act="again">Done</button></div>
  </div>`;
}

// ---------- garden ----------
function flowerSVG(x, groundY, f, bloom, i, d) {
  const c = col(f);
  const stemH = bloom ? 70 : 42;
  const top = groundY - stemH;
  const head = bloom
    ? `${[0, 60, 120, 180, 240, 300].map((a) => `<ellipse cx="${x}" cy="${top - 11}" rx="9" ry="15" fill="${c}" transform="rotate(${a} ${x} ${top})"/>`).join("")}<circle class="head" cx="${x}" cy="${top}" r="8" fill="#ffe27a" stroke="#263329" stroke-opacity=".2"/>`
    : `<ellipse class="head" cx="${x}" cy="${top - 4}" rx="9" ry="13" fill="${c}" stroke="#263329" stroke-opacity=".2"/>`;
  return `<g class="flower" tabindex="0" role="button" data-i="${i}" aria-label="${nice(d)}: ${byId[f].label}${bloom ? ", bloomed" : ", growing"}">
    <path d="M${x} ${groundY}V${top}" stroke="#8cc47a" stroke-width="4" stroke-linecap="round"/>
    <path d="M${x} ${groundY - 18}c-12 0-16-8-16-14 9 0 16 5 16 14z" fill="#a8d695"/>
    ${head}</g>`;
}

function renderGarden() {
  const list = garden.flowers.slice(-28);
  const W = 720, H = 220, ground = 150;
  if (!list.length) {
    $("bed").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="An empty garden bed, ready for your first flower">
      <rect x="0" y="${ground - 6}" width="${W}" height="${H}" fill="var(--soil-dark)" opacity=".25"/>
      <path d="M${W / 2} ${ground}v-26" stroke="#4f7d3f" stroke-width="4" stroke-linecap="round"/>
      <path d="M${W / 2} ${ground - 14}c-11 0-15-7-15-13 8 0 15 4 15 13zM${W / 2} ${ground - 20}c0-8 6-12 14-12 0 7-5 12-14 12z" fill="#6fa35a"/>
      <text x="${W / 2}" y="${H - 20}" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="20" fill="var(--fg)">Pick a feeling above to plant your first flower</text></svg>`;
    $("picked").textContent = "";
  } else {
    const gap = W / (Math.max(list.length, 7) + 1);
    $("bed").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Your garden, ${list.length} flower${list.length === 1 ? "" : "s"}">
      <rect x="0" y="${ground - 6}" width="${W}" height="${H}" fill="var(--soil-dark)" opacity=".25"/>
      ${list.map((fl, i) => flowerSVG(gap * (i + 1), ground, fl.f, fl.bloom, i, fl.d)).join("")}</svg>`;
  }
  const counts = {};
  garden.flowers.forEach((x) => { counts[x.f] = (counts[x.f] || 0) + 1; });
  $("legend").innerHTML = garden.flowers.length
    ? FEELINGS.filter((f) => counts[f.id]).map((f) => `<span><i style="--c:${col(f.id)}"></i>${f.label} ${counts[f.id]}</span>`).join("") + `<span>· ${garden.flowers.length} day${garden.flowers.length === 1 ? "" : "s"} checked in</span>`
    : "";
}
const showFlower = (g) => {
  const fl = garden.flowers.slice(-28)[+g.dataset.i];
  if (fl) $("picked").textContent = `${nice(fl.d)}: you felt ${byId[fl.f].label.toLowerCase()}${fl.bloom ? " and your flower bloomed" : ""}.`;
};
$("bed").addEventListener("click", (e) => { const g = e.target.closest(".flower"); if (g) showFlower(g); });
$("bed").addEventListener("keydown", (e) => { const g = e.target.closest(".flower"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); showFlower(g); } });

function renderAll() { renderFeelings(); renderGarden(); }
$("today").textContent = `Today is ${nice(todayKey())}.`;
renderAll();

// ---------- install as an app ----------
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let dismissed = false;
try { dismissed = localStorage.getItem("installTipClosed") === "1"; } catch {}
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let deferred = null;
if (!standalone && !dismissed) {
  if (isIOS) {
    $("installText").innerHTML = 'Put Feelings Garden on your iPhone: tap the <b>Share</b> button <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share" style="vertical-align:-4px"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>, then <b>Add to Home Screen</b>.';
    $("installTip").hidden = false;
  }
  addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault(); deferred = e;
    $("installBtn").hidden = false; $("installTip").hidden = false;
  });
}
$("installBtn").addEventListener("click", async () => {
  if (!deferred) return;
  deferred.prompt();
  try { await deferred.userChoice; } catch {}
  deferred = null; $("installTip").hidden = true;
});
$("installClose").addEventListener("click", () => { $("installTip").hidden = true; try { localStorage.setItem("installTipClosed", "1"); } catch {} });
addEventListener("appinstalled", () => { $("installTip").hidden = true; });

// Works offline after the first visit
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
</html>
